kind = "web"
previewPath = "/"
title = "EthioStream Pro"
version = "1.0.0"
id = "artifacts/ethiostream-pro"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22605

[services.development]
run = "pnpm --filter @workspace/ethiostream-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ethiostream-pro", "run", "build" ]
publicDir = "artifacts/ethiostream-pro/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22605"
BASE_PATH = "/"
